<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskDaily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="TaskDaily" href="icon.jfif" type="image/x-icon">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: radial-gradient(circle at 50% 0%, #111a33 0%, #060911 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        /* Mobile Input fix to stop auto-zoom */
        input, select, textarea {
            font-size: 16px !important;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 999px; }
        
        .modal-backdrop {
            background: rgba(4, 6, 12, 0.85);
            backdrop-filter: blur(10px);
        }

        /* Checkbox Design */
        .checkbox-container { display: block; position: relative; cursor: pointer; user-select: none; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark {
            position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            height: 24px; width: 24px; background-color: #1e293b;
            border: 2px solid #334155; border-radius: 8px; transition: all 0.2s ease;
        }
        .checkbox-container input:checked ~ .checkmark {
            background-color: #3b82f6; border-color: #3b82f6;
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.5);
        }
        .checkmark:after { content: ""; position: absolute; display: none; }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }
        .checkbox-container .checkmark:after {
            left: 7.5px; top: 3.5px; width: 5px; height: 11px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-3 sm:p-6 md:p-10 pb-32 selection:bg-blue-600 selection:text-white">

    <div class="fixed top-[-100px] left-1/2 -translate-x-1/2 w-[100vw] h-[300px] bg-blue-600/10 blur-[120px] pointer-events-none -z-10 rounded-full"></div>

    <main class="w-full max-w-lg md:max-w-xl space-y-4">
        
        <!-- Header -->
        <div class="glass-card rounded-3xl p-5 sm:p-7 shadow-2xl relative overflow-hidden">
            <div class="flex items-center justify-between gap-4">
                <div class="space-y-1.5 flex-1">
                    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] font-bold tracking-widest uppercase">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                        Phnom Penh Time
                    </div>
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">TaskDaily</h1>
                    <p id="live-date" class="text-xs sm:text-sm text-slate-400 font-medium">Loading date...</p>
                </div>

                <div class="relative flex items-center justify-center shrink-0">
                    <svg class="w-20 h-20 sm:w-28 sm:h-28 -rotate-90">
                        <circle cx="50%" cy="50%" r="38" stroke="rgba(255,255,255,0.05)" stroke-width="6" fill="transparent" />
                        <circle id="progress-circle" cx="50%" cy="50%" r="38" stroke="url(#blue-gradient)" stroke-width="6" fill="transparent"
                                stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round"
                                class="transition-all duration-700 ease-out" />
                        <defs>
                            <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38bdf8" /><stop offset="100%" stop-color="#3b82f6" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center text-center">
                        <span id="progress-percent" class="text-base sm:text-xl font-black text-white">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task Panel -->
        <div class="glass-card rounded-3xl p-4 sm:p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
                <span class="text-sm font-bold tracking-wide text-slate-300">Overview</span>
                <div class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                    <button onclick="setFilter('all')" id="tab-all" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all">All</button>
                    <button onclick="setFilter('daily')" id="tab-daily" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">Daily</button>
                    <button onclick="setFilter('custom')" id="tab-custom" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">Custom</button>
                </div>
            </div>
            <div id="tasks-container" class="space-y-3 max-h-[50vh] overflow-y-auto pr-1 custom-scrollbar"></div>
        </div>

    </main>

    <!-- Floating Action Button -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 sm:bottom-10 sm:right-10 w-16 h-16 bg-gradient-to-tr from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white rounded-full flex items-center justify-center shadow-2xl shadow-blue-500/40 active:scale-90 transition-all z-40">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
    </button>

    <!-- Mobile-Optimized Modal -->
    <div id="task-modal" class="fixed inset-0 modal-backdrop z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Slides up from bottom on mobile, pops in center on desktop -->
        <div class="glass-card w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 sm:p-7 shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 border-t sm:border border-slate-700/60" id="modal-box">
            
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <h3 class="text-xl font-bold text-white tracking-tight">New Task</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-slate-900/60 border border-slate-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="create-task-form" class="space-y-5 pt-5">
                <div class="space-y-2">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Title</label>
                    <input type="text" id="task-input" placeholder="What needs to be done?" required
                           class="w-full bg-slate-900/80 border border-slate-800 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-4 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Type</label>
                        <select id="task-type" class="w-full bg-slate-900/80 border border-slate-800 text-slate-200 rounded-xl px-3 py-4 focus:outline-none focus:border-blue-500 transition-all">
                            <option value="daily">Daily Reset</option>
                            <option value="custom">One-time</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Time</label>
                        <select id="task-time" class="w-full bg-slate-900/80 border border-slate-800 text-slate-200 rounded-xl px-3 py-4 focus:outline-none focus:border-blue-500 transition-all">
                            <option value="Anytime">Anytime</option>
                            <option value="6:00 AM">6:00 AM</option>
                            <option value="7:00 AM">7:00 AM</option>
                            <option value="8:00 AM">8:00 AM</option>
                            <option value="9:00 AM">9:00 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="3:00 PM">3:00 PM</option>
                            <option value="6:00 PM">6:00 PM</option>
                            <option value="9:00 PM">9:00 PM</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/25 active:scale-95 transition-all flex justify-center items-center h-14 mt-2">
                    <span>Create Task</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        let taskData = [];
        let activeTab = 'all';

        // Phnom Penh Date Formatter for UI
        document.getElementById('live-date').innerText = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Phnom_Penh', weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
        }).format(new Date());

        // Spinner SVG Generator
        const getSpinner = (color) => `<svg class="animate-spin h-5 w-5 ${color}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

        function openModal() {
            const modal = document.getElementById('task-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            // Desktop scale animation
            box.classList.remove('sm:scale-95');
            box.classList.add('sm:scale-100');
            // Mobile slide up animation
            box.classList.remove('translate-y-full');
            box.classList.add('translate-y-0');
        }

        function closeModal() {
            const modal = document.getElementById('task-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('sm:scale-100');
            box.classList.add('sm:scale-95');
            box.classList.remove('translate-y-0');
            box.classList.add('translate-y-full');
        }

        function timeToMinutes(timeStr) {
            if (!timeStr || timeStr === 'Anytime') return 1440; 
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return 1440;
            let h = parseInt(match[1], 10), m = parseInt(match[2], 10), mod = match[3].toUpperCase();
            if (mod === 'PM' && h < 12) h += 12;
            if (mod === 'AM' && h === 12) h = 0;
            return h * 60 + m;
        }

        async function loadTasks() {
            try {
                const res = await fetch('/api/tasks');
                taskData = await res.json();
                taskData.sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed - b.completed;
                    const timeA = timeToMinutes(a.task_time);
                    const timeB = timeToMinutes(b.task_time);
                    if (timeA !== timeB) return timeA - timeB;
                    return b.id - a.id;
                });
                renderUI();
            } catch (err) { console.error(err); }
        }

        document.getElementById('create-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const btn = document.getElementById('submit-btn');
            
            // Show Loading Spinner on Button
            const originalText = btn.innerHTML;
            btn.innerHTML = getSpinner('text-white');
            btn.disabled = true;

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        title: input.value, 
                        category: document.getElementById('task-type').value,
                        task_time: document.getElementById('task-time').value 
                    })
                });
                if (res.ok) {
                    input.value = '';
                    closeModal();
                    await loadTasks();
                }
            } catch (err) { console.error(err); } 
            finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        async function toggleTask(id, state) {
            try {
                await fetch(`/api/tasks/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: state })
                });
                loadTasks();
            } catch (err) { console.error(err); }
        }

        async function removeTask(id, btnElement) {
            // Show Loading Spinner on Trash Icon
            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = getSpinner('text-red-400');
            btnElement.disabled = true;

            try {
                await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                await loadTasks();
            } catch (err) { 
                console.error(err); 
                btnElement.innerHTML = originalHtml;
                btnElement.disabled = false;
            }
        }

        function setFilter(filter) {
            activeTab = filter;
            ['all', 'daily', 'custom'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (tab === filter) btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all";
                else btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
            });
            renderUI();
        }

        function renderUI() {
            const container = document.getElementById('tasks-container');
            const filtered = taskData.filter(t => activeTab === 'all' || t.category === activeTab);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-slate-500 text-sm font-medium">All caught up! Add a task below.</div>`;
            } else {
                container.innerHTML = filtered.map(task => `
                    <div class="group flex items-center justify-between p-4 sm:p-5 rounded-2xl transition-all border ${task.completed ? 'bg-slate-900/30 border-slate-900 opacity-50' : 'bg-slate-900/60 border-slate-800/80'}">
                        <div class="flex items-center gap-4 flex-1 min-w-0">
                            <label class="checkbox-container shrink-0 w-6 h-6">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id}, this.checked)">
                                <span class="checkmark"></span>
                            </label>
                            <div class="space-y-1 truncate flex-1 pl-1">
                                <span class="text-[15px] font-semibold block truncate ${task.completed ? 'line-through text-slate-500' : 'text-slate-100'}">
                                    ${escapeHtml(task.title)}
                                </span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md ${task.category === 'daily' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' : 'bg-purple-500/10 text-purple-400 border border-purple-500/20'}">${task.category}</span>
                                    <span class="text-[9px] font-bold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-md border border-blue-500/20 flex items-center gap-1">
                                        <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        ${escapeHtml(task.task_time || 'Anytime')}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <button onclick="removeTask(${task.id}, this)" class="text-slate-500 hover:text-red-400 p-2 rounded-xl active:scale-90 transition-all sm:opacity-0 group-hover:opacity-100 shrink-0 flex items-center justify-center w-10 h-10">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                `).join('');
            }

            const total = taskData.length;
            const completed = taskData.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('progress-percent').innerText = `${percentage}%`;
            
            // Circumference for r=38 is ~238.76
            const offset = 238.76 - (percentage / 100) * 238.76;
            document.getElementById('progress-circle').style.strokeDashoffset = offset;
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        loadTasks();
    </script>
</body>
</html>
